<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<link rel="icon" href="/favicon.ico">
		<title>Preact</title>
		<meta name="viewport" content="width=device-width, initial-scale=1.0, minimal-ui">
		<meta name="color-scheme" content="dark">
		<meta name="theme-color" content="#16171d">
		<link rel="preload" href="/src/style/fonts/plus-jakarta-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
		<link rel="alternate" type="application/rss+xml" href="https://preactjs.com/feed.xml">
		<link rel="alternate" type="application/atom+xml" href="https://preactjs.com/feed.atom">
		<meta property="og:image" content="https://preactjs.com/app-icon.png">
		<meta name="twitter:card" content="summary">
		<link href="https://esm.sh" rel="preconnect" crossorigin="anonymous">
		<link href="https://www.google-analytics.com" rel="preconnect" crossorigin="anonymous">
		<script>
			// Reader input before the app has loaded, see src/lib/reader-input.js
			window.__readerInput = -1;
			for (const type of ['pointerdown', 'keydown', 'wheel', 'touchstart']) {
				addEventListener(type, () => (window.__readerInput = performance.now()), { capture: true, passive: true });
			}
		</script>
	</head>
	<body>
		<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
			<defs>
				<symbol id="link" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2">
					<path d="M15 7h3a5 5 0 0 1 5 5 5 5 0 0 1-5 5h-3m-6 0H6a5 5 0 0 1-5-5 5 5 0 0 1 5-5h3"></path>
					<line x1="8" y1="12" x2="16" y2="12"></line>
				</symbol>
			</defs>
		</svg>
		<div id="app"></div>
		<script type="module" src="./src/index.jsx"></script>
	</body>
</html>
